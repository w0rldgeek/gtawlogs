<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Актуализация номеров абонентов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-icon">📇</span>
                <span class="brand-text">Актуализация номеров абонентов</span>
            </div>
            <div class="topbar-actions">
                <span id="db-status" class="badge">База не открыта</span>
                <button class="btn btn-primary" id="btn-open">📂 Открыть базу</button>
                <button class="btn btn-ghost" id="btn-create">✨ Создать</button>
                <button class="btn btn-ghost" id="btn-download" title="Сохранить файл базы">⬇ Сохранить файл</button>
                <input type="file" id="file-input" accept=".xlsx" hidden>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Форма добавления -->
        <section class="card">
            <h2 class="card-title">Добавить абонента</h2>
            <div class="subscriber-form">
                <div class="field">
                    <label for="f-address">Адрес</label>
                    <input type="text" id="f-address" autocomplete="off">
                </div>
                <div class="field">
                    <label for="f-login">Логин</label>
                    <input type="text" id="f-login" autocomplete="off">
                </div>
                <div class="field">
                    <label for="f-date">Дата</label>
                    <input type="date" id="f-date">
                </div>
                <div class="field">
                    <label for="f-phone">Номер телефона</label>
                    <input type="text" id="f-phone" autocomplete="off">
                </div>
                <div class="form-actions">
                    <span class="form-hint">Заполните поля и нажмите <kbd>Enter</kbd> — строка сразу сохранится в файл-базу.</span>
                    <input type="text" id="f-filter" class="filter-input" placeholder="🔍 Поиск по адресу / логину / номеру...">
                </div>
            </div>
        </section>

        <!-- Предпросмотр того, что записано в Excel, по месяцам -->
        <section id="table-container">
            <div class="empty-state">Загрузка...</div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
